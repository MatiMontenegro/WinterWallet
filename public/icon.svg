      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#1a1d3a"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cf7c8"/>
