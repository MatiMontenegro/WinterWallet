<!doctype html>
<html lang="en">
<head>
    <title>Winter Wallet - Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card p-4 shadow" style="max-width:400px;width:100%">
        <h2 class="text-center mb-3">Winter Wallet</h2>
        <div id="login-message" class="text-danger mb-2"></div>
        <form id="loginForm" class="mb-3">
            <input type="text" id="loginUser" class="form-control mb-2" placeholder="Usuario" required>
            <input type="password" id="loginPass" class="form-control mb-2" placeholder="Contraseña" required>
            <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>
        <hr>
        <h5 class="text-center">Crear cuenta</h5>
        <form id="registerForm">
            <input type="text" id="registerUser" class="form-control mb-2" placeholder="Usuario" required>
            <input type="password" id="registerPass" class="form-control mb-2" placeholder="Contraseña" required>
            <button class="btn btn-secondary w-100" type="submit">Registrar</button>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
